name: Build Blender post-office GLB

on:
  push:
    paths:
      - 'source-assets/levels/generate-graybox-blender.py'
      - '.github/workflows/export-blender.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender exporter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
      - name: Generate geometry.glb from Blender
        run: blender --background --factory-startup --python source-assets/levels/generate-graybox-blender.py
      - name: Verify glTF IDs
        run: node scripts/check-geometry.mjs
      - name: Commit generated GLB
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/content/l01/geometry.glb
          if ! git diff --cached --quiet; then
            git commit -m 'assets(stage1): export named post-office GLB from Blender'
            git push origin HEAD:main
          fi
      - name: Archive exported geometry
        uses: actions/upload-artifact@v4
        with:
          name: blender-post-office-glb
          path: public/content/l01/geometry.glb
