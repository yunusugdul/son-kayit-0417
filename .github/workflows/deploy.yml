name: Stage 1 - Navigation, browser smoke and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stage1-browser-smoke-and-pages
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build, smoke, measurements
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Generate and commit reproducible npm lockfile (first run only)
        shell: bash
        run: |
          if [[ ! -f package-lock.json ]]; then
            npm install --package-lock-only --ignore-scripts
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: pin npm dependencies for Stage 0'
            git push origin HEAD:main
          fi
      - name: Install from lockfile
        run: npm ci
      - name: Collect dependency security audit
        shell: bash
        run: |
          mkdir -p artifacts
          npm audit --json > artifacts/npm-audit-all.json || true
          npm audit --omit=dev --json > artifacts/npm-audit-prod.json || true
      - name: Typecheck and production build
        run: npm run check
      - name: Inspect statically served file sizes
        run: npm run report:sizes
      - name: Verify live Render HTML and static assets
        run: npm run check:live
      - name: Confirm runner Chrome installation
        run: google-chrome --version
      - name: Browser smoke tests (production preview)
        run: npm run test:e2e
      - name: Upload visual evidence, size and browser metrics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-evidence
          path: |
            artifacts/
            playwright-report/
          if-no-files-found: ignore
      - name: Prepare GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Explain Pages activation requirement
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages requires repository Settings > Pages > Source: GitHub Actions"
          echo "### Publishing is blocked by Pages administration permission" >> "$GITHUB_STEP_SUMMARY"
          echo "Enable GitHub Pages from repository Settings > Pages, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production artifact
        id: deployment
        uses: actions/deploy-pages@v4
