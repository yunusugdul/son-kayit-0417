name: Stage 0 - Build, browser smoke and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Typecheck, build, smoke, measurements
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Generate and commit reproducible npm lockfile (first run only)
        shell: bash
        run: |
          if [[ ! -f package-lock.json ]]; then
            npm install --package-lock-only --ignore-scripts
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: pin npm dependencies for Stage 0'
            git push origin HEAD:main
          fi
      - name: Install from lockfile
        run: npm ci
      - name: Typecheck and production build
        run: npm run check
      - name: Inspect statically served file sizes
        run: npm run report:sizes
      - name: Confirm runner Chrome installation
        run: google-chrome --version
      - name: Browser smoke tests (production preview)
        run: npm run test:e2e
      - name: Generate performance and transfer report
        run: npm run report:stage0
      - name: Upload visual evidence, size and browser metrics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage0-evidence
          path: |
            artifacts/
            playwright-report/
          if-no-files-found: ignore
      - name: Commit measured results to repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stage0-measurements.md
          git diff --cached --quiet || (git commit -m 'docs: record Stage 0 browser and build measurements' && git push origin HEAD:main)
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production artifact
        id: deployment
        uses: actions/deploy-pages@v4
